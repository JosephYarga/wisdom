<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WISDOM · Jesus saves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Bodoni+Moda:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, sincere, hopeful; the gospel told simply to whoever scanned the shirt
   IDEA: a golden cross of light in a 3D night sky, then a terminal that "decodes" the heart
   PICTURE: React Three Fiber scene: metallic gold cross, halo, light rays, rising light particles
   COLOUR and TYPE: night black, chalk white, one warm gold; JetBrains Mono + Bodoni Moda
   LAYOUT: full-screen 3D hero with the message, then glass panels over the living 3D background */
:root{color-scheme:dark;--bg:#07070a;--panel:rgba(22,22,26,.62);--ink:#f3f1ea;--mute:#a19d93;--gold:#d4a843;--warn:#e07a5f;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.65 "JetBrains Mono",ui-monospace,Menlo,monospace;overflow-x:clip;background:radial-gradient(120% 80% at 50% 0%,#1a1408 0%,#07070a 60%)}
.bg3d{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg3d canvas{width:100%!important;height:100%!important;display:block}
.static-cross{position:absolute;left:50%;top:18%;width:90px;height:150px;transform:translateX(-50%)}
.static-cross:before,.static-cross:after{content:"";position:absolute;background:var(--gold);border-radius:4px;box-shadow:0 0 60px rgba(212,168,67,.6)}
.static-cross:before{left:38px;top:0;width:14px;height:150px}.static-cross:after{left:8px;top:36px;width:74px;height:14px}
#root{position:relative;z-index:1}
.top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:820px;margin:0 auto;padding:18px max(5vw,16px)}
.brand{font-weight:800;font-size:15px;color:var(--mute)}.brand b{color:var(--ink)}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:rgba(0,0,0,.35);backdrop-filter:blur(6px)}
.lang button{border:0;border-radius:0;min-height:40px;padding:0 14px;color:var(--mute);font-size:14px;background:transparent}
.lang button[aria-pressed=true]{background:var(--gold);color:#111}
.hero{min-height:calc(100svh - 76px);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding:0 max(5vw,16px) 28px}
.hero-spacer{flex:1}
h1{font-family:"Bodoni Moda",Georgia,serif;font-weight:400;font-size:clamp(36px,8.5vw,64px);line-height:1.05;margin:0;text-wrap:balance;text-shadow:0 4px 30px rgba(0,0,0,.8)}
h1 em{font-style:normal;color:var(--gold)}
.scroll-hint{margin:14px 0 0;font-size:26px;color:var(--gold);animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
main{max-width:760px;margin:0 auto;padding:24px max(5vw,16px) 40px;display:flex;flex-direction:column;gap:40px}
.glass,.term{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.term{overflow:hidden;box-shadow:0 30px 80px -30px #000;transition:transform .2s ease}
.bar{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.bar i{width:11px;height:11px;border-radius:50%;background:#3a3a3a;display:block}
.bar span{margin-left:10px;color:var(--mute);font-size:13px}
.out{padding:18px 18px 22px;min-height:240px;font-size:clamp(12.5px,3.3vw,15px);white-space:pre-wrap;word-break:break-word}
.out .cmd{font-weight:700}.out .ok{color:var(--gold);font-weight:700}.out .warn{color:var(--warn);font-weight:700}.out .dim{color:var(--mute)}
.cursor{display:inline-block;width:.6em;height:1.1em;background:var(--gold);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s ease}.reveal.on{opacity:1;transform:none}
h2{font-family:"Bodoni Moda",Georgia,serif;font-weight:500;font-size:clamp(24px,5vw,32px);line-height:1.15;margin:0 0 18px}
.serif{font-family:"Bodoni Moda",Georgia,serif;font-size:clamp(19px,4.4vw,23px);line-height:1.5}
.ref{display:block;font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--gold);margin-top:8px}
.verse{margin:0;padding:20px 22px;border-left:3px solid var(--gold);border-radius:0 14px 14px 0;transition:opacity .25s,box-shadow 1s}
.verse.lit{box-shadow:0 0 60px -10px rgba(212,168,67,.45)}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.card{display:grid;grid-template-columns:46px minmax(0,1fr);gap:14px;padding:18px;transition:transform .2s ease}
.num{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-weight:800;box-shadow:0 0 18px rgba(212,168,67,.35) inset}
.card h3{margin:0 0 4px;font-size:16px}.card p{margin:0;color:#dcd8ce;font-size:15px}
.pray{background:linear-gradient(160deg,#f6f2e7,#e9dfc6);color:#151515;border-radius:18px;padding:clamp(22px,4vw,34px);box-shadow:0 30px 90px -20px rgba(212,168,67,.45);transition:transform .2s ease}
.pray h2{color:#151515}.pray .intro{margin:0 0 14px;font-size:15px}
.pray .prayer{margin:0;font-style:italic}
.pray .next{margin:18px 0 0;font-size:14px;border-top:1px solid #cdbf9c;padding-top:14px}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
button{font:700 15px "JetBrains Mono",monospace;min-height:46px;padding:0 20px;border-radius:10px;border:1px solid var(--gold);background:rgba(0,0,0,.35);color:var(--gold);cursor:pointer}
button.solid{background:var(--gold);color:#111}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
footer{position:relative;z-index:1;text-align:center;color:var(--mute);font-size:13px;padding:8px 16px 40px}
footer small{display:block;margin-top:4px;font-size:12px}
.credit{color:var(--ink);font-size:14px;margin-bottom:4px}.credit b{color:var(--gold)}
.credit a{color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(212,168,67,.5);white-space:nowrap}
.foot2{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);max-width:520px;margin-inline:auto}
@media (prefers-reduced-motion:reduce){.cursor,.scroll-hint{animation:none}.reveal{transition:none;opacity:1;transform:none}}
</style>
</head>
<body>
<div id="root"></div>
<noscript><p style="padding:24px;text-align:center">Jésus t'aime. Il est venu pour te sauver. (Jean 3:16)</p></noscript>

`]],h1:"Jesus loves you.<br>He came <em>to save you.</em>",verse:"For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.",vref:"John 3:16",stepsTitle:"The good news in 4 steps",steps:[["God loves you","God created you and loves you personally. He wants a relationship with you, today and for eternity.","John 3:16"],["Sin separates us from God","All of us have done wrong. Sin breaks our relationship with God, and its consequence is death.","Romans 3:23 \xB7 6:23"],["Jesus paid the price","Jesus, the Son of God, died on the cross in your place and rose again on the third day. He opened the way back to God.","Romans 5:8 \xB7 1 Corinthians 15:3-4"],["Receive him by faith","Salvation is a free gift. You cannot earn it. You receive it by believing in Jesus and giving him your life.","Romans 10:9 \xB7 Ephesians 2:8"]],prayTitle:"A simple prayer",prayIntro:"If you want to receive Jesus today, you can talk to God with your own words, or pray this:",prayer:"Lord Jesus, I know that I am a sinner and I need you. I believe that you died on the cross for me and that you rose again. I ask you to forgive my sins. I open the door of my heart: come into my life and be my Lord and my Savior. Thank you for your love and for the gift of eternal life. Amen.",next:"Prayed this prayer? Welcome to the family of God. Read the Gospel of John, talk to God every day, and find a church near you where you can grow in faith.",verseTitle:"A word for you today",another:"another verse",copy:"copy link",copied:"copied \u2714",fail:"copy failed",foot:"You scanned a WISDOM shirt \xB7 Ouagadougou \xB7 226",verses:[["Come unto me, all ye that labour and are heavy laden, and I will give you rest.","Matthew 11:28"],["But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us.","Romans 5:8"],["For the wages of sin is death; but the gift of God is eternal life through Jesus Christ our Lord.","Romans 6:23"],["Jesus saith unto him, I am the way, the truth, and the life: no man cometh unto the Father, but by me.","John 14:6"],["For by grace are ye saved through faith; and that not of yourselves: it is the gift of God.","Ephesians 2:8"],["Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new.","2 Corinthians 5:17"],["Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him.","Revelation 3:20"],["If we confess our sins, he is faithful and just to forgive us our sins, and to cleanse us from all unrighteousness.","1 John 1:9"],["Neither is there salvation in any other: for there is none other name under heaven given among men, whereby we must be saved.","Acts 4:12"],["That if thou shalt confess with thy mouth the Lord Jesus, and shalt believe in thine heart that God hath raised him from the dead, thou shalt be saved.","Romans 10:9"]],src:"Bible verses: King James Version"},fr:{lines:[["cmd","$ ./decode --purpose"],["dim",`

`]],h1:"J\xE9sus t'aime.<br>Il est venu <em>pour te sauver.</em>",verse:"Car Dieu a tant aim\xE9 le monde qu'il a donn\xE9 son Fils unique, afin que quiconque croit en lui ne p\xE9risse point, mais qu'il ait la vie \xE9ternelle.",vref:"Jean 3:16",stepsTitle:"La bonne nouvelle en 4 \xE9tapes",steps:[["Dieu t'aime","Dieu t'a cr\xE9\xE9 et il t'aime personnellement. Il veut une relation avec toi, aujourd'hui et pour l'\xE9ternit\xE9.","Jean 3:16"],["Le p\xE9ch\xE9 nous s\xE9pare de Dieu","Nous avons tous fait le mal. Le p\xE9ch\xE9 brise notre relation avec Dieu, et sa cons\xE9quence, c'est la mort.","Romains 3:23 \xB7 6:23"],["J\xE9sus a pay\xE9 le prix","J\xE9sus, le Fils de Dieu, est mort sur la croix \xE0 ta place et il est ressuscit\xE9 le troisi\xE8me jour. Il a ouvert le chemin vers Dieu.","Romains 5:8 \xB7 1 Corinthiens 15:3-4"],["Re\xE7ois-le par la foi","Le salut est un cadeau gratuit. Tu ne peux pas le m\xE9riter. Tu le re\xE7ois en croyant en J\xE9sus et en lui donnant ta vie.","Romains 10:9 \xB7 \xC9ph\xE9siens 2:8"]],prayTitle:"Une pri\xE8re simple",prayIntro:"Si tu veux recevoir J\xE9sus aujourd'hui, tu peux parler \xE0 Dieu avec tes propres mots, ou prier ainsi :",prayer:"Seigneur J\xE9sus, je reconnais que je suis un p\xE9cheur et que j'ai besoin de toi. Je crois que tu es mort sur la croix pour moi et que tu es ressuscit\xE9. Je te demande de pardonner mes p\xE9ch\xE9s. J'ouvre la porte de mon c\u0153ur : entre dans ma vie et sois mon Seigneur et mon Sauveur. Merci pour ton amour et pour le don de la vie \xE9ternelle. Amen.",next:"Tu as fait cette pri\xE8re ? Bienvenue dans la famille de Dieu. Lis l'\xC9vangile de Jean, parle \xE0 Dieu chaque jour, et trouve une \xE9glise pr\xE8s de chez toi pour grandir dans la foi.",verseTitle:"Une parole pour toi aujourd'hui",another:"un autre verset",copy:"copier le lien",copied:"copi\xE9 \u2714",fail:"copie impossible",foot:"Tu as scann\xE9 un t-shirt WISDOM \xB7 Ouagadougou \xB7 226",verses:[["Venez \xE0 moi, vous tous qui \xEAtes fatigu\xE9s et charg\xE9s, et je vous donnerai du repos.","Matthieu 11:28"],["Mais Dieu prouve son amour envers nous, en ce que, lorsque nous \xE9tions encore des p\xE9cheurs, Christ est mort pour nous.","Romains 5:8"],["Car le salaire du p\xE9ch\xE9, c'est la mort ; mais le don gratuit de Dieu, c'est la vie \xE9ternelle en J\xE9sus-Christ notre Seigneur.","Romains 6:23"],["J\xE9sus lui dit : Je suis le chemin, la v\xE9rit\xE9, et la vie. Nul ne vient au P\xE8re que par moi.","Jean 14:6"],["Car c'est par la gr\xE2ce que vous \xEAtes sauv\xE9s, par le moyen de la foi. Et cela ne vient pas de vous, c'est le don de Dieu.","\xC9ph\xE9siens 2:8"],["Si quelqu'un est en Christ, il est une nouvelle cr\xE9ature. Les choses anciennes sont pass\xE9es ; voici, toutes choses sont devenues nouvelles.","2 Corinthiens 5:17"],["Voici, je me tiens \xE0 la porte, et je frappe. Si quelqu'un entend ma voix et ouvre la porte, j'entrerai chez lui.","Apocalypse 3:20"],["Si nous confessons nos p\xE9ch\xE9s, il est fid\xE8le et juste pour nous les pardonner, et pour nous purifier de toute iniquit\xE9.","1 Jean 1:9"],["Il n'y a de salut en aucun autre ; car il n'y a sous le ciel aucun autre nom qui ait \xE9t\xE9 donn\xE9 parmi les hommes, par lequel nous devions \xEAtre sauv\xE9s.","Actes 4:12"],["Si tu confesses de ta bouche le Seigneur J\xE9sus, et si tu crois dans ton c\u0153ur que Dieu l'a ressuscit\xE9 des morts, tu seras sauv\xE9.","Romains 10:9"]],src:"Versets bibliques : traduction Louis Segond 1910"}};var Ko=typeof matchMedia!="undefined"&&matchMedia("(prefers-reduced-motion: reduce)").matches,jM="#d4a843",$b={p:0},fl={x:0,y:0};function e3(){let n=document.createElement("canvas");n.width=n.height=256;let e=n.getContext("2d"),t=e.createRadialGradient(128,128,0,128,128,128);t.addColorStop(0,"rgba(255,226,150,1)"),t.addColorStop(.25,"rgba(212,168,67,0.55)"),t.addColorStop(1,"rgba(212,168,67,0)"),e.fillStyle=t,e.fillRect(0,0,256,256);let i=new Du(n);return i.colorSpac
